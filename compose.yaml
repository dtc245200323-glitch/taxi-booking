services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U taxi -d taxi']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks: [backend]
  migrate:
    build: .
    command: [python, migrate.py]
    environment:
      DATABASE_URL: 'postgresql://taxi:${POSTGRES_PASSWORD}@db:5432/taxi'
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?Set MONITOR_DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DRIVER_PASSWORD: ${DRIVER_PASSWORD:?Set DRIVER_PASSWORD}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:?Set CUSTOMER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
  app:
    build: .
    command: [gunicorn, '--bind', '0.0.0.0:8000', '--workers', '1', '--threads', '4', '--access-logfile', '-', 'app:app']
    environment:
      DATABASE_URL: 'postgresql://taxi_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/taxi'
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DRIVER_PASSWORD: ${DRIVER_PASSWORD:?Set DRIVER_PASSWORD}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:?Set CUSTOMER_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-taxi@localhost}
      SMTP_TLS: ${SMTP_TLS:-true}
      ADMIN_RESET_EMAIL: ${ADMIN_RESET_EMAIL:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      MAP_SEARCH_URL: ${MAP_SEARCH_URL:-https://photon.komoot.io/api/}
      MAP_ROUTING_URL: ${MAP_ROUTING_URL:-https://router.project-osrm.org/route/v1/driving}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_USER_AGENT: ${MAP_USER_AGENT:-TaxiBookingStudentProject/1.0 (+http://127.0.0.1:8080)}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [edge, backend, monitoring]
  nginx:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge, backend, monitoring]
  pgadmin:
    image: dpage/pgadmin4:9.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD}
    ports: ['127.0.0.1:5050:80']
    volumes: [pgadmin_data:/var/lib/pgadmin]
    depends_on: [db]
    restart: unless-stopped
    networks: [edge, backend]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    restart: unless-stopped
    networks: [edge, monitoring]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3000:3000']
    restart: unless-stopped
    networks: [edge, monitoring]
  loki:
    image: grafana/loki:3.5.3
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./infra/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks: [monitoring]
  alloy:
    image: grafana/alloy:v1.10.2
    command: [run, /etc/alloy/config.alloy, '--storage.path=/var/lib/alloy/data']
    volumes:
      - ./infra/config.alloy:/etc/alloy/config.alloy:ro
      - nginx_logs:/var/log/nginx:ro
      - alloy_data:/var/lib/alloy/data
    depends_on: [loki, nginx]
    restart: unless-stopped
    networks: [monitoring]
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ['--nginx.scrape-uri=http://nginx:8081/stub_status']
    depends_on: [nginx]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [monitoring]
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: 'postgresql://taxi_monitor:${MONITOR_DB_PASSWORD:?Set MONITOR_DB_PASSWORD}@db:5432/taxi?sslmode=disable'
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend, monitoring]
  container-exporter:
    build: ./infra/container-exporter
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-baikiemtra}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [monitoring]

networks:
  edge:
  backend:
    internal: true
  monitoring:
    internal: true
volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_logs:
  alloy_data:
