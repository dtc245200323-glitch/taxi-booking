global:
  scrape_interval: 15s
scrape_configs:
  - job_name: taxi-api
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: containers
    static_configs:
      - targets: ['container-exporter:9108']
